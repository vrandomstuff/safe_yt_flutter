name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
            artifact: app-release.apk
            output: build/app/outputs/flutter-apk/app-release.apk
          - platform: ios
            os: macos-latest
            artifact: safe_yt.ipa
            output: build/ios/ipa/safe_yt.ipa

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android
        if: matrix.platform == 'android'
        run: flutter build apk --release

      - name: Build iOS
        if: matrix.platform == 'ios'
        run: flutter build ios --release --no-codesign

      - name: Package iOS app
        if: matrix.platform == 'ios'
        run: |
          set -euo pipefail
          rm -rf build/ios/packaging
          mkdir -p build/ios/ipa build/ios/packaging
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios/iphoneos/Runner.app \
            build/ios/ipa/Runner.ipa
          unzip -q build/ios/ipa/Runner.ipa -d build/ios/packaging
          mkdir build/ios/packaging/Payload
          mv build/ios/packaging/Runner.app build/ios/packaging/Payload/
          cd build/ios/packaging
          ditto -c -k --keepParent Payload ../ipa/safe_yt.ipa
          rm -f ../ipa/Runner.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-${{ matrix.artifact }}
          path: ${{ matrix.output }}
          if-no-files-found: error
